name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  TF_CPP_MIN_LOG_LEVEL: "2"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m spacy download en_core_web_sm

      - name: Quality gate
        run: python check_quality.py

      - name: Automatic tests
        run: pytest -v

  image:
    name: image
    needs: test            # starts only if the job "test" succeeded
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t film-api:ci --build-arg GIT_COMMIT=${{ github.sha }} .

      - name: Show the image size
        run: docker images film-api:ci

      - name: Start the container
        run: docker run -d --name api -p 8000:8000 film-api:ci

      - name: Check that the API starts
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8000/health; then
              echo
              exit 0
            fi
            sleep 3
          done
          echo "The API did not start in time"
          exit 1

      - name: Check /health returns the commit id
        run: curl -fs http://localhost:8000/health | grep -q "${{ github.sha }}"

      - name: Check /predict with a valid text
        run: |
          curl -fs -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"text": "A group of friends is hunted by a masked killer in an abandoned cabin in the woods."}'

      - name: Container logs (on failure)
        if: failure()
        run: docker logs api
